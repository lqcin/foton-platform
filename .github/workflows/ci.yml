name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Import smoke test
        env:
          FOTON_DATA_DIR: ${{ runner.temp }}/foton-data
          FOTON_SEED_DEMO: "false"
        run: python -c "from app.main import app; assert app.title == 'FOTON Platform'"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t foton-platform:ci .
